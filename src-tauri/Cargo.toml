[package]
name = "nexora-ai"
description = "Nexora AI — desktop and mobile shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nexora_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
gethostname = "1"
nexora-core = { path = "../crates/nexora-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }

# OS secure store: Keychain (macOS), Credential Manager (Windows), Secret Service (Linux).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
os_info = { version = "3", default-features = false }
tauri-plugin-updater = "2"

# Android: secrets are encrypted with a key held in the Android Keystore.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-nexora-keystore = { path = "../crates/tauri-plugin-nexora-keystore" }
