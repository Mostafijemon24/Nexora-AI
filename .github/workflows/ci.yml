name: CI

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Also build and start the app on Windows, macOS, Linux and Android (the Platforms workflow)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}${{ inputs.platforms && '-platforms' || '' }}
  cancel-in-progress: true

jobs:
  # Only when asked for from the Actions tab: the Platforms workflow, on the chosen branch.
  platforms:
    if: ${{ inputs.platforms }}
    uses: ./.github/workflows/platforms.yml

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nexora, POSTGRES_PASSWORD: nexora, POSTGRES_DB: nexora_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Builds the server image exactly as the VPS does and starts the whole production stack.
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write test settings
        run: |
          cat > deploy/.env <<EOF
          API_DOMAIN=api.test.local
          APP_ORIGINS=http://localhost:1420
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          LICENSE_SIGNING_KEY=$(openssl rand -base64 32)
          DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)
          HASH_SECRET=$(openssl rand -hex 32)
          COMPOSE_PROFILES=
          API_PORT=8787
          EOF
      - name: Build and start
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180 postgres redis api worker
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8787/healthz
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml exec -T api node src/cli.ts license:create --email ci@example.com --name CI --workspace CI > /dev/null
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml exec -T api node src/cli.ts pubkey
      - name: Logs
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs --tail 80
      - run: bash -n deploy/install.sh
