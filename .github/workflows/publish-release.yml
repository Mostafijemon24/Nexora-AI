name: Publish release

# Publishes the draft release that "Release installers" created, using the notes in
# docs/release-notes/<tag>.md. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        default: v1.0.0
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" --notes-file "docs/release-notes/$TAG.md" --draft=false --latest
          gh release view "$TAG" --json isDraft,url,assets --jq '{isDraft,url,assets:[.assets[].name]}'
