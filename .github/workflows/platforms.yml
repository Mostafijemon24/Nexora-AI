name: Platforms

# Builds the app the way a release does, on every desktop platform and for Android, and then runs
# it: a build that compiles but does not start fails here.
#
#   desktop  Windows, macOS and Linux: all installers are built (with the installer artwork) and
#            signed for auto-update with a key made for this run only, as a release does with the
#            real key. Then the app is started with NEXORA_SMOKE_TEST=1. It passes only if the
#            window's UI loads, calls into the Rust shell and is still running 15 seconds later.
#   android  A debug APK is built and installed on an emulator. It passes only if the UI loads, the
#            Android Keystore stores and returns a secret, and the device registration survives a
#            restart of the app. The APK is kept as a workflow artifact for 14 days.
#   android-release  The signed release build (.apk and .aab), with a keystore made for this run
#            only. Nothing from it is kept; it shows that the release workflow's Android job works.
#
# Runs from the Actions tab, and on pushes to main that touch the native shell.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/platforms.yml"

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev patchelf xvfb dbus-x11
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Updater key for this run only
        id: updater
        shell: bash
        run: |
          npx tauri signer generate --ci -p "" -f -w "$RUNNER_TEMP/updater.key" > /dev/null
          TAURI_UPDATER_PUBKEY="$(cat "$RUNNER_TEMP/updater.key.pub")" TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/updater.key")" \
            bash src-tauri/updater/enable.sh
      - name: Build the app and its installers
        run: npx tauri build ${{ steps.updater.outputs.args }}
      - name: List what was built
        shell: bash
        run: |
          find target/release/bundle -maxdepth 2 -type f -size +100k | sort
          echo "Signed update packages:"
          find target/release/bundle -name '*.sig' | sort | grep . || { echo "None were produced."; exit 1; }
      - name: Start the app and check that it stays up
        shell: bash
        env:
          NEXORA_SMOKE_TEST: "1"
        run: |
          case "$RUNNER_OS" in
            Linux)   run=(xvfb-run -a dbus-run-session -- target/release/nexora-ai) ;;
            Windows) run=(target/release/nexora-ai.exe) ;;
            macOS)   run=("$(find target/release/bundle/macos -path '*.app/Contents/MacOS/*' -type f | head -n 1)") ;;
          esac
          echo "Starting: ${run[*]}"
          "${run[@]}" &
          pid=$!
          # The app quits by itself with the result; this only stops a run that hangs.
          ( sleep 240; echo "The app did not finish within 4 minutes."; kill -9 "$pid" 2> /dev/null ) &
          watchdog=$!
          code=0
          wait "$pid" || code=$?
          kill "$watchdog" 2> /dev/null || true
          echo "Exit code: $code"
          exit "$code"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build a debug APK
        run: bash src-tauri/android/build.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-android-debug
          path: src-tauri/gen/android/dist/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash src-tauri/android/emulator-test.sh "$(ls src-tauri/gen/android/dist/*.apk | head -n 1)"

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build and sign with a keystore for this run only
        env:
          ANDROID_KEY_ALIAS: rehearsal
        run: |
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/rehearsal.jks"
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Nexora AI CI rehearsal"
          bash src-tauri/android/build.sh release
          test -s "$(ls src-tauri/gen/android/dist/*.apk | head -n 1)"
          test -s "$(ls src-tauri/gen/android/dist/*.aab | head -n 1)"
