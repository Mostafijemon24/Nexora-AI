[package]
name = "nexora-core"
description = "Nexora AI platform-independent core: offline queue, local cache and entitlement verification."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
